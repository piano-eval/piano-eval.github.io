testname: Custom test
testId: custom
bufferSize: 2048
stopOnErrors: true
showButtonPreviousPage: false
showProgressBar: false
remoteService: //piano-eval.com/adaptive-navigation
pages:
  - type: likert_multi_stimulus
    id: lms1
    name: Question 1
    content: test description
    mustPlayback: processUpdate
    stimuli:
        C1: configs/resources/audio/mono_c1.wav
        C2: configs/resources/audio/mono_c2.wav
        C3: configs/resources/audio/mono_c3.wav
    stimulusQuestionnaire:
      - type: slider
        name: confidence
        label: Confidence
        optional: true
        min: 0
        max: 100
  - type: finish
    name: Thank you
    content: Thank you for attending
    showResults: true
    writeResults: true
