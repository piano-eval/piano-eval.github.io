testname: AB without looping
testId: custom
bufferSize: 2048
stopOnErrors: true
showButtonPreviousPage: false
showProgressBar: false
remoteService: //piano-eval.com/adaptive-navigation
pages:
  - type: generic
    id: login
    name: Start
    content: >-
      <p>Welcome to the virtual Barcelona soundwalk.</p>
      <p>Experience the sounds of Barcelona like you were there. Discover all ten destinations.</p>
      <p>All sounds downloaded from <a href="https://freesound.org/">Freesound</a>, see respective pages for links.</p>
  - type: likert_single_stimulus
    id: placa-catalunya
    name: Pla&ccedil;a de Catalunya
    content: <a href="https://freesound.org/s/66619/">66619__susoooo__23-08-08-20-00-plaza-de-catalunya</a>
    send: forget
    stimuli:
        C1: soundwalk/66619__susoooo__23-08-08-20-00-plaza-de-catalunya.mp3
    questionnaire:
      - type: long_text
        label: Impressions
        optional: true
      - type: likert
        name: go
        label: "Go"
        response:
          - value: 0
            label: north-west
  - type: finish
    name: Thank you
    content: Thank you for attending
    showResults: true
    writeResults: true
